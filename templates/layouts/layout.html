<!DOCTYPE html>
<html lang="{{ locale }}" data-theme="{{ theme }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{{ ui_head }}}
<title>{{ title }} — RoboHub Feed</title>
{{{ forms_style }}}
<style>
  /* What only Feed's pages have; the look itself is robohub.ui's. */
  .rh-main { padding: 1.1rem 1.3rem 2rem; display: grid; gap: 1rem; align-content: start; min-width: 0; }
  .ph h1 { margin: 0; }
  .ph p { margin: .2rem 0 0; max-width: 70ch; }
  .rh-card.wide { display: block; }
  .rh-card h2 { font-size: 1.02rem; margin: 0 0 .6rem; }
  .app-chip { display: inline-flex; align-items: center; gap: .4rem; font: 600 .72rem/1 var(--sans); padding: .32rem .6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .app-chip::before { content: ""; width: .45rem; height: .45rem; border-radius: 50%; background: var(--teal); }
  .app-chip.mode::before { background: var(--gold); }
  form.inline { display: inline-flex; margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th { text-align: left; font: 600 .7rem var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: .35rem .4rem; border-bottom: 1px solid var(--line); }
  td { padding: .45rem .4rem; border-top: 1px solid var(--line); vertical-align: middle; }
  td.num, .num { text-align: right; white-space: nowrap; }
  td.err, dd.err { color: var(--stop); }
  .d, .hint, .note { font-size: .78rem; color: var(--faint); }
  .badge { font: 700 .6rem/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: .25rem .4rem; border-radius: 5px; background: var(--wash); color: var(--muted); border: 1px solid var(--line); }
  .badge.auto { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
  .app-form { display: grid; gap: .6rem; }
  .app-form.grid-form { grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); align-items: end; }
  .app-form label { display: grid; gap: .2rem; font-size: .76rem; color: var(--faint); }
  .app-form label.check { display: flex; align-items: center; gap: .4rem; }
  .app-form fieldset.pubs { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 8px; display: grid; gap: .3rem; padding: .5rem .7rem; }
  .app-form fieldset.pubs label { display: flex; align-items: center; gap: .4rem; font-size: .84rem; color: var(--ink); }
  .app-actions { grid-column: 1 / -1; }
  .feed-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .6rem; }
  dl.status { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; margin: 0; font-size: .86rem; }
  dl.status dt { color: var(--faint); }
  dl.status dd { margin: 0; }
  button.danger, .rh button.danger { color: var(--stop); border-color: var(--stop); }
  table.items input, table.items select { max-width: 12rem; }
  .preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
  .preview-one { display: grid; gap: .3rem; }
  .preview-one code { font-size: .72rem; color: var(--faint); }
  pre.embed, pre.docs { white-space: pre-wrap; font-size: .8rem; background: var(--wash); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .8rem; overflow-x: auto; }
  pre.docs { font-size: .84rem; background: none; border: 0; padding: 0; }
  @media (max-width: 860px) {
    .rh-main { padding: .8rem .8rem 4.5rem; }
    table.items td:nth-child(3) { display: none; }
  }
</style>
</head>
<body class="rh">
{{{ topbar }}}
<div class="rh-shell">
  <nav class="rh-rail">{{{ nav }}}</nav>
  <main class="rh-main">{{{ body }}}</main>
</div>
{{{ notifications }}}
</body>
</html>
