# The Rho unit tests are a small C project of their own.
#
# Feed is a go-server, so building a test file beside its own manifest would
# ask for Feed's target and generate the service. A test only needs the C
# backend, and giving the test directory its own manifest is what says so.
module:
  name: feed-tests
  id: robohub.app.feed-tests
  type: rho
  version: 0.1.0

main: feed_test.rho

build:
  language: c
  targets:
    - c
